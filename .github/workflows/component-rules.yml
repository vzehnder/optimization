name: Component rules
on:
  push:
    paths: ['app/**', 'src/**', 'test/**', 'scripts/**', 'runtime/component_rules/**', 'tests/test_reg00*', 'tests/fixtures/**', 'frontend/**', '.github/workflows/component-rules.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'test/**', 'scripts/**', 'runtime/component_rules/**', 'tests/test_reg00*', 'tests/fixtures/**', 'frontend/**', '.github/workflows/component-rules.yml']
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rules_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      POSTGRES_TEST_DATABASE_URL: 'postgresql://test:test@127.0.0.1:5432/rules_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. test/component_rules.jl
      - run: pip install -r requirements.txt
      - name: Build the same Linux sandbox used in development
        run: |
          docker build -t component-rules:reg-004 runtime/component_rules
          echo "RULE_RUNTIME_IMAGE=$(docker image inspect component-rules:reg-004 --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_reg001_rules tests.test_reg001_runtime tests.test_reg002_rules tests.test_reg002_runtime tests.test_reg003_rules tests.test_reg003_runtime tests.test_reg003_classification tests.test_reg004_rules tests.test_reg004_runtime tests.test_ts7_001_classification_catalog -v
      - run: npm ci
        working-directory: frontend
      - run: npm run api:check && npm test -- --run src/ComponentRules.test.tsx src/HourlyRules.test.tsx src/RelatedRules.test.tsx src/RunExperience.test.tsx src/ProtectedMutationJourney.test.tsx && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test e2e/component-rules.spec.ts
        working-directory: frontend
      - run: npx playwright test e2e/component-rules-execution.spec.ts
        working-directory: frontend
        env:
          RULE_ACCEPTANCE_SERVER: '1'
      - run: npx playwright test e2e/component-rules-hourly.spec.ts
        working-directory: frontend
        env:
          RULE_ACCEPTANCE_SERVER: '1'
      - run: npx playwright test e2e/component-rules-related.spec.ts
        working-directory: frontend
        env:
          RULE_ACCEPTANCE_SERVER: '1'
